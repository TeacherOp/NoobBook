version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: noobbook-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    networks:
      - noobbook_net

  frontend:
    build:
      context: ./frontend
    container_name: noobbook-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - noobbook_net

volumes:
  backend_data:

networks:
  noobbook_net:
    driver: bridge
